name: Update contribution badge

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC (off the hour to avoid peak load)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch this year's contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR="$(date -u +%Y)"
          TOTAL="$(gh api graphql \
            -f query='query($login: String!, $from: DateTime!, $to: DateTime!) { user(login: $login) { contributionsCollection(from: $from, to: $to) { contributionCalendar { totalContributions } } } }' \
            -f login=Linz1248 \
            -F from="${YEAR}-01-01T00:00:00Z" \
            -F to="${YEAR}-12-31T23:59:59Z" \
            --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')"
          echo "Year: $YEAR, Contributions: $TOTAL"
          mkdir -p assets
          printf '{"schemaVersion":1,"label":"%s contributions","message":"%s","color":"0e75b6"}\n' "$YEAR" "$TOTAL" > assets/contributions-badge.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-badge.json
          if git diff --cached --quiet; then
            echo "No change, skipping commit."
          else
            git commit -m "chore: update contribution badge [skip ci]"
            git push
          fi
